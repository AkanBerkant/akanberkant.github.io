<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FalaBak — Coffee Fortune, Tarot & Astrology</title>
  <meta name="description" content="FalaBak — daily coffee fortune, tarot, palm & face readings, zodiac and astrology insights right on your phone." />
  <style>
    :root { --gold:#E6C078; --bg:#1a1430; --bg2:#2a1f4d; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      color:#fff; background:linear-gradient(160deg,var(--bg) 0%,var(--bg2) 100%);
      min-height:100vh; display:flex; align-items:center; justify-content:center; text-align:center;
      padding:32px;
    }
    .wrap { max-width:640px; }
    .logo { font-size:18px; letter-spacing:4px; color:var(--gold); text-transform:uppercase; margin-bottom:24px; }
    h1 { font-size:44px; line-height:1.15; margin-bottom:16px; font-weight:800; }
    h1 span { color:var(--gold); }
    p.lead { font-size:18px; line-height:1.6; opacity:.85; margin-bottom:32px; }
    .features { display:flex; flex-wrap:wrap; gap:12px; justify-content:center; margin-bottom:40px; }
    .features span { background:rgba(255,255,255,.08); border:1px solid rgba(230,192,120,.25); padding:8px 16px; border-radius:999px; font-size:14px; }
    .cta a { display:inline-block; background:var(--gold); color:#1a1430; font-weight:700; text-decoration:none; padding:14px 32px; border-radius:999px; font-size:16px; }
    footer { margin-top:48px; font-size:13px; opacity:.5; }
    footer a { color:var(--gold); text-decoration:none; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo">FalaBak</div>
    <h1>Discover your destiny with <span>FalaBak</span></h1>
    <p class="lead">Daily coffee fortune, tarot, palm &amp; face readings, zodiac compatibility and astrology insights — all in one app.</p>
    <div class="features">
      <span>☕ Coffee Fortune</span>
      <span>🔮 Tarot</span>
      <span>✋ Palm Reading</span>
      <span>🌙 Astrology</span>
      <span>♈ Zodiac</span>
    </div>
    <div class="cta">
      <a href="https://play.google.com/store/apps/details?id=com.rodinya.falabaken">Get it on Google Play</a>
    </div>
    <footer>
      © FalaBak · <a href="mailto:akanberkanttt@gmail.com">Contact</a>
    </footer>
  </div>
</body>
</html>
